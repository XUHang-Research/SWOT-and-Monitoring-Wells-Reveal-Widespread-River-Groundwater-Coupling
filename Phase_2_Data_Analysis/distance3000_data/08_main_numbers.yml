provenance:
  scope: global SWOT x in-situ well, 2023-2025, datum-free relative metrics, <=3km
    by distance_prior_bank_m, reach-level
  dev_countries:
  - China
  - Germany
  denominator_note: all headline fractions are computed at Reach level. A/tau uses
    median A and equal-weight circular-mean tau across monthly-eligible sites within
    3 km; standalone event-r uses the complete independently daily-eligible population,
    as does the same-date raw/seasonal-harmonic/residual comparison. Only direct monthly-versus-daily
    paired tests use a frozen monthly-daily intersection. CIs are Reach-level bootstraps
    (n=10000).
  distance_column: distance_prior_bank_m
  reach_phase_aggregation: equal-weight circular mean of site phase differences
  harmonic_eligibility:
    minimum_pairwise_finite_observations: 18
    minimum_elapsed_span_years: 1.5
    model_parameters: 6
    full_column_rank_required: true
    maximum_condition_number: 10000.0
    accepted_record_policy: use all pairwise-finite observations; do not truncate
  generated_by: 06_main_numbers.py
